services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contafin}
      POSTGRES_USER: ${POSTGRES_USER:-contafin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contafin_dev}
    ports:
      - "5432:5432"
    volumes:
      - contafin-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contafin}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_DB: ${POSTGRES_DB:-contafin}
      POSTGRES_USER: ${POSTGRES_USER:-contafin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contafin_dev}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-32-bytes-min}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  adminer:
    image: adminer:4
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  contafin-postgres-data:
