services:
  - type: web
    name: sistema-contable
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: APP_SEED_ENABLED
        value: "true"
      # Datos de conexión a la base de datos (Supabase). No tienen valor aquí a
      # propósito: Render los pedirá al aplicar este blueprint, o se llenan luego
      # a mano en el panel del servicio → Environment. Ver DEPLOY.md.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
