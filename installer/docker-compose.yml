services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: contafin
      POSTGRES_USER: contafin
      POSTGRES_PASSWORD: contafin_dev
    ports:
      - "5432:5432"
    volumes:
      - sistema-contable-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contafin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sistema-contable-data:
